<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Background: Deep cosmic gradient (the void before divine light) -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#0C1023"/>
    <stop offset="55%"  stop-color="#0F0D38"/>
    <stop offset="100%" stop-color="#1E082E"/>
  </linearGradient>

  <!-- N letterform: Knowledge blue fading to cosmic purple -->
  <linearGradient id="nG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#5B8AF5"/>
    <stop offset="100%" stop-color="#A870F8"/>
  </linearGradient>

  <!-- Saffron aura rising from base (Agni / sacred fire) -->
  <radialGradient id="saffronAura" cx="50%" cy="80%" r="55%">
    <stop offset="0%"   stop-color="#FF7722" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#FF7722" stop-opacity="0"/>
  </radialGradient>

  <!-- Gold aura from top (divine grace descending) -->
  <radialGradient id="goldAura" cx="50%" cy="18%" r="40%">
    <stop offset="0%"   stop-color="#F5C518" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
  </radialGradient>

  <!-- Glow filter for the N and third eye -->
  <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Crescent moon mask: main circle minus offset circle = crescent -->
  <mask id="moonMask">
    <rect width="1024" height="1024" fill="white"/>
<circle cx="785" cy="138" r="46" fill="black"/>
  </mask>

</defs>




<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 1: Cosmic background                          -->
<!-- ═══════════════════════════════════════════════════ -->
<rect width="1024" height="1024" rx="196" fill="url(#bg)"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 2: Sudarshana Chakra (Jagannath's divine wheel) -->
<!-- 16-spoke sacred wheel — very subtle background aura  -->
<!-- ═══════════════════════════════════════════════════ -->
<g transform="translate(512,512)" opacity="0.07" fill="none" stroke="#8AA8FF" stroke-linecap="round">
  <!-- Three concentric rings of the chakra -->
  <circle r="395" stroke-width="3"/>
  <circle r="368" stroke-width="1.5"/>
  <circle r="342" stroke-width="1"/>
  <!-- 8 primary spokes -->
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(0)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(45)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(90)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(135)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(180)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(225)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(270)"/>
  <line y1="-342" y2="-395" stroke-width="4.5" transform="rotate(315)"/>
  <!-- 8 secondary spokes (finer) -->
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(22.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(67.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(112.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(157.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(202.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(247.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(292.5)"/>
  <line y1="-360" y2="-395" stroke-width="2" transform="rotate(337.5)"/>
</g>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 3: Divine auras (light from above and below)  -->
<!-- ═══════════════════════════════════════════════════ -->
<rect width="1024" height="1024" rx="196" fill="url(#saffronAura)"/>
<rect width="1024" height="1024" rx="196" fill="url(#goldAura)"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 4: Om-inspired arch above the N               -->
<!-- The arc of divine sound connecting the two peaks    -->
<!-- ═══════════════════════════════════════════════════ -->
<path d="M 314,274 Q 512,196 710,274"
      fill="none" stroke="#9B6EF3" stroke-width="5.5"
      stroke-linecap="round" opacity="0.50"/>
<!-- Bindu at the tip of the Om arc (the sacred point) -->
<circle cx="710" cy="274" r="7" fill="#F5C518" opacity="0.65"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 5: N Letterform                               -->
<!-- The central identity — Knowledge ascending          -->
<!-- ═══════════════════════════════════════════════════ -->
<polyline points="296,756 296,268 728,756 728,268"
          fill="none"
          stroke="url(#nG)"
          stroke-width="68"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 6: Divya Netra — Third Eye of Mahadev        -->
<!-- Placed at midpoint of N's diagonal stroke          -->
<!-- Diagonal angle from (296,268)→(728,756): ≈48.5°   -->
<!-- ═══════════════════════════════════════════════════ -->
<g transform="translate(512,512) rotate(48.5)" filter="url(#glow)">
  <!-- Outer eye / almond shape -->
  <path d="M -26,0 Q 0,-15 26,0 Q 0,15 -26,0 Z"
        fill="none" stroke="#F5C518" stroke-width="3.5" opacity="0.90"/>
  <!-- Iris (saffron) -->
  <circle r="9" fill="#FF7722" opacity="0.95"/>
  <!-- Pupil (deep indigo) -->
  <circle r="4" fill="#0C1023"/>
  <!-- Eyelid highlight -->
  <circle cx="0" cy="-18" r="2.5" fill="#F5C518" opacity="0.55"/>
</g>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 7: Tripundra Tilak — Mahadev's sacred mark   -->
<!-- Three horizontal vibhuti stripes above the N       -->
<!-- ═══════════════════════════════════════════════════ -->
<!-- Top stripe (widest, faintest — fading into ether)  -->
<line x1="406" y1="204" x2="618" y2="204"
      stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.42"/>
<!-- Middle stripe -->
<line x1="418" y1="222" x2="606" y2="222"
      stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
<!-- Bottom stripe (narrowest, most defined — earth-facing) -->
<line x1="432" y1="240" x2="592" y2="240"
      stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.88"/>
<!-- Rudra Bindu — the sacred red dot below the tilak   -->
<circle cx="512" cy="258" r="11" fill="#FF4400" opacity="0.95"/>
<circle cx="512" cy="258" r="15" fill="none" stroke="#F5C518" stroke-width="2.5" opacity="0.55"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 8: Chandra Shekhar — the crescent moon       -->
<!-- Shiva wears the crescent moon as his crown jewel   -->
<!-- ═══════════════════════════════════════════════════ -->
<g transform="rotate(-40 734 330)">
  <circle cx="764" cy="139" r="50"
          fill="#F5C518"
          opacity="0.95"
          mask="url(#moonMask)"/>
</g>
<!-- Celestial field of stars around the crescent -->
<circle cx="846" cy="120" r="5.5" fill="#F5C518" opacity="0.62"/>
<circle cx="872" cy="168" r="3.5" fill="#F5C518" opacity="0.42"/>
<circle cx="824" cy="82"  r="4"   fill="#F5C518" opacity="0.38"/>
<circle cx="894" cy="142" r="2.5" fill="#F5C518" opacity="0.28"/>
<circle cx="806" cy="200" r="3"   fill="#A870F8" opacity="0.32"/>
<circle cx="862" cy="210" r="2"   fill="#F5C518" opacity="0.22"/>
<circle cx="880" cy="96"  r="2"   fill="#F5C518" opacity="0.28"/>

<!-- ═══════════════════════════════════════════════════ -->
<!-- LAYER 9: Bottom accent — grounding energy          -->
<!-- ═══════════════════════════════════════════════════ -->
<circle cx="512" cy="826" r="8" fill="#F5C518" opacity="0.25"/>
<line x1="448" y1="826" x2="492" y2="826" stroke="#F5C518" stroke-width="2"
      stroke-linecap="round" opacity="0.20"/>
<line x1="532" y1="826" x2="576" y2="826" stroke="#F5C518" stroke-width="2"
      stroke-linecap="round" opacity="0.20"/>

</svg>
